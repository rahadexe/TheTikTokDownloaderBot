<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>RH TikTok — Clean HD Downloader</title>
  <meta name="description" content="Clean, fast TikTok video & MP3 downloader without watermarks.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Noto+Color+Emoji&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="app-shell">
    
    <!-- Top Nav -->
    <header class="app-nav">
      <div class="nav-brand">
        <span class="brand-glyph">RH</span>
        <span class="brand-text">TikTok</span>
      </div>
      <a href="https://t.me/TheTikTokDownloaderBot" target="_blank" class="nav-tg">
        Telegram Bot ↗
      </a>
    </header>

    <!-- Main View -->
    <main class="app-body">
      
      <!-- Input Box -->
      <section class="input-card">
        <form id="extractForm" class="url-form">
          <div class="field-wrap">
            <input 
              type="url" 
              id="dockUrl" 
              class="field-input" 
              placeholder="Paste TikTok link here..." 
              required
              autocomplete="off"
              spellcheck="false"
            >
            <button type="button" id="pasteBtn" class="paste-tag">Paste</button>
          </div>
          <button type="submit" id="extractBtn" class="action-btn">
            <span class="btn-text">Get Video</span>
            <span class="btn-spinner" style="display: none;">Resolving...</span>
          </button>
        </form>

        <div class="sample-bar">
          <button type="button" id="sampleBtn" class="sample-action">Try sample link</button>
        </div>
      </section>

      <!-- Clean Result Card -->
      <section id="inspectorCard" class="media-sheet" style="display: none;">
        
        <!-- Media Summary: Left thumbnail, Right details -->
        <div class="media-brief">
          <div class="thumb-frame" id="playerTrigger">
            <video id="mediaVideo" playsinline preload="metadata" poster=""></video>
            <div class="play-overlay">
              <span class="play-symbol">▶</span>
            </div>
            <span class="quality-badge">HD</span>
          </div>

          <div class="meta-details">
            <div class="creator-line">
              <img id="creatorAvatar" src="" alt="Avatar" class="avatar-circle">
              <div class="creator-names">
                <span id="creatorName" class="name-label">Creator</span>
                <span id="creatorHandle" class="handle-label">@username</span>
              </div>
            </div>
            <p id="mediaCaption" class="caption-text"></p>
            <div class="audio-tag">
              <span class="audio-icon">♪</span>
              <span id="audioTitle" class="audio-label">Original Sound</span>
            </div>
          </div>
        </div>

        <!-- Download Buttons -->
        <div class="download-stack">
          <a id="btnHdVideo" href="#" class="btn-dl btn-dl-primary" download>
            <span class="dl-title">Download Video (No Watermark)</span>
            <span class="dl-sub">Original 1080p MP4</span>
          </a>

          <a id="btnAudioMp3" href="#" class="btn-dl btn-dl-secondary" download>
            <span class="dl-title">Extract Audio (MP3)</span>
            <span class="dl-sub">High Quality Audio Track</span>
          </a>

          <div class="extra-actions">
            <a id="btnCover" href="#" target="_blank" class="extra-link">Save Poster</a>
            <span class="sep">·</span>
            <a id="btnFastServer" href="#" class="extra-link" download>Fast Mirror</a>
          </div>
        </div>

      </section>

    </main>

    <footer class="app-foot">
      <span>RH Tools · Fast &amp; Ad-Free</span>
    </footer>

  </div>

  <script src="app.js"></script>
</body>
</html>
